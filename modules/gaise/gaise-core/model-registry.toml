# Ollama embedding families. Ollama normalizes every vector it returns, so
# `normalized_output` / `normalizes_truncation` are true throughout; the
# task controls below are each family's documented prefix convention.

[[models]]
provider = "ollama"
model = "embeddinggemma:*"
status = "dynamic_local"
capabilities = ["embeddings"]
gaise_support = "native"
notes = "EmbeddingGemma 300m; Matryoshka 768/512/256/128; 2,048-token context; Google prompt-instruction convention."
[models.embedding]
default_dimensions = 768
dimension_rule = { set = [128, 256, 512, 768] }
max_input_tokens = 2048
normalized_output = true
normalizes_truncation = true
task_control = "prompt_instruction"

[[models]]
provider = "ollama"
model = "nomic-embed-text:*"
status = "dynamic_local"
capabilities = ["embeddings"]
gaise_support = "native"
notes = "nomic-embed-text v1.5; Matryoshka 64-768; 8,192-token context (raise num_ctx); prefixes are required for good retrieval."
[models.embedding]
default_dimensions = 768
dimension_rule = { range = { min = 64, max = 768 } }
max_input_tokens = 8192
normalized_output = true
normalizes_truncation = true
task_control = { prefix = { query = "search_query: ", document = "search_document: ", classification = "classification: ", clustering = "clustering: " } }

[[models]]
provider = "ollama"
model = "nomic-embed-text-v2-moe:*"
status = "dynamic_local"
