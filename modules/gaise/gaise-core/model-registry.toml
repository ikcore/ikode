# GAISe model compatibility and lifecycle registry
# Audited against official provider documentation on 2026-08-20.
# Context windows, output ceilings, and character budgets (`context_window`,
# `max_output_tokens`, `max_input_characters`) were verified against the same
# vendor model pages on 2026-08-21; embedding per-text limits live in
# `[models.embedding] max_input_tokens`.
#
# This registry is advisory. GAISe deliberately accepts arbitrary model IDs, so
# newly released models can work before this file is updated. Provider model
# catalogs, regional availability, account access, and API surfaces remain the
# final authority.

schema_version = 2
audited_on = "2026-08-20"

# Capability vocabulary (closed; parsed by gaise_core::registry):
#   input modalities : text, image_input, audio_input, video_input, files
#   output modalities: text, image_output, audio_output, embeddings
#   operations       : embeddings -> Embeddings, realtime -> Live,
#                      text (+streaming) -> Instruct (+InstructStream)
#   features         : tools, reasoning, adaptive_reasoning, manual_reasoning,
#                      image_editing, multimodal_embeddings
# `operations = [...]` overrides the derived operations; `operations = []`
# marks a model GAISe can describe but not drive (Responses-only, TTS, Live
# where the provider crate has no live transport).
# Entries may use `*` wildcards for dynamic families; dated snapshots and
# Bedrock `-vN:M` suffixes match their base entry automatically.

[[providers]]
key = "openai"
gaise_surface = "Chat Completions, Embeddings, and Realtime"
catalog = "https://developers.openai.com/api/docs/models"
lifecycle = "https://developers.openai.com/api/docs/deprecations"
discovery = "GET /v1/models (id, created, owned_by, shutdown_date only)"
notes = "The current instruct client uses Chat Completions. Responses-only features and the Images API are outside that client."

[[providers]]
key = "anthropic"
gaise_surface = "Messages"
catalog = "https://platform.claude.com/docs/en/about-claude/models/overview"
lifecycle = "https://platform.claude.com/docs/en/about-claude/model-deprecations"
discovery = "GET /v1/models (capabilities: image_input, pdf_input, thinking types, effort levels, structured_outputs, token limits)"
notes = "Direct Claude API lifecycle. Bedrock-hosted Claude has a separate AWS lifecycle."

[[providers]]
key = "gemini"
gaise_surface = "Gemini generateContent, streamGenerateContent, Embeddings, and Live"
catalog = "https://ai.google.dev/gemini-api/docs/models"
lifecycle = "https://ai.google.dev/gemini-api/docs/deprecations"
discovery = "GET /v1beta/models (supportedGenerationMethods, token limits, thinking flag; no modalities)"
notes = "Google AI Gemini API lifecycle; do not reuse these dates for Vertex AI. Shutdown dates on the deprecations page are the earliest possible retirement dates."

[[providers]]
key = "vertexai"
gaise_surface = "Vertex AI generateContent, streamGenerateContent, and Embeddings"
catalog = "https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/models"
lifecycle = "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-versions"
discovery = "GET {region}-aiplatform.googleapis.com/v1beta1/publishers/{publisher}/models (names, versionId, launchStage; no modalities or limits)"
notes = "Model availability and retirement dates are specific to Google Cloud. Short-term availability models retire 45 days after a replacement is released."

[[providers]]
key = "bedrock"
gaise_surface = "Converse, ConverseStream, and InvokeModel"
catalog = "https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards.html"
lifecycle = "https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html"
discovery = "ListFoundationModels, GetFoundationModel, and ListInferenceProfiles"
notes = "Model IDs, inference profiles, lifecycle, and availability vary by AWS region. AWS replaced the Converse feature matrix with per-model cards (model-card-*.html) and models-api-compatibility.html in mid-2026."

[[providers]]
key = "elevenlabs"
gaise_surface = "Text-to-speech, streaming speech, realtime voice WebSocket, and model listing"
catalog = "https://elevenlabs.io/docs/overview/models"
lifecycle = "https://elevenlabs.io/docs/overview/models"
discovery = "GET /v1/models (model_id, languages, can_do_text_to_speech, can_use_style, character limits); GET /v2/voices for voices"
notes = "Voices are account-specific and default voices expire 2026-12-31; never hard-code a voice id. Character limits per request are model-specific; the character-cost header reports billing."

[[providers]]
key = "ollama"
gaise_surface = "Chat, streaming chat, and Embeddings"
catalog = "https://ollama.com/search"
lifecycle = "dynamic local catalog"
discovery = "GET /api/tags"
notes = "Tags are installed locally and can move; Ollama has no centralized retirement calendar."

