[package]
name = "gaise-provider-bedrock"
description = "AWS Bedrock provider for GAISe — Claude and other models via AWS Bedrock Runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
gaise-core.workspace = true
serde_json.workspace = true
serde.workspace = true
async-trait.workspace = true
tokio.workspace = true
futures-util.workspace = true
base64.workspace = true
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1.0"
aws-sdk-bedrock = "1"
aws-smithy-runtime = { version = "1.0", features = ["client", "connector-hyper-0-14-x"] }
aws-smithy-types = "1.0"
bytes = "1.0"
async-stream = "0.3"
hyper-rustls = { version = "0.24", default-features = false, features = ["http1", "http2", "tls12", "webpki-tokio"] }
