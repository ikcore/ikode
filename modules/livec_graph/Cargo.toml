[package]
name = "livec_graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
description = "WAL-backed in-memory property graph used by iKode"
license = "AGPL-3.0-only"
repository = "https://github.com/ikcore/ikode-alpha"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
parking_lot = "0.12.5"   #// faster RwLock
thiserror = "2.0.17"
ahash = "0.8.12"          #// (optional) faster hashing
time = "0.3.44" 
base64 = "0.22"
crc32fast = "1.5.0"
fs2 = "0.4.3"
lz4_flex = "0.13.1"

[dev-dependencies]
tempfile = "3.23.0"
